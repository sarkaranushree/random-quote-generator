
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover a new inspiring quote every day.">
    <title>Quote of the Moment</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="quote-card">
        <p class="eyebrow">A LITTLE INSPIRATION</p>

        <h1>Quote of the Moment</h1>

        <div class="quote-mark" aria-hidden="true">“</div>

        <p id="quote" aria-live="polite">
            Loading your first quote...
        </p>

        <p id="author"></p>

        <p id="status" role="status"></p>

        <button id="new-quote" type="button">
            New Quote <span aria-hidden="true">↗</span>
        </button>

        <p class="footer-text">A fresh thought, a fresh perspective.</p>
    </main>
</body>
</html>
